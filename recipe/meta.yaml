{% set name = "elyra-pipeline-editor-extension" %}
{% set version = "4.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d0ae1beb2d94261f9182f0bb18b8b9eea81fded9b3e5d7b823045a1c06409589

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - jupyter-packaging
    - pip
    - python {{ python_min }}
  run:
    - elyra-server =={{ version }}
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  commands:
    - exit 0

about:
  home: https://github.com/elyra-ai/elyra
  summary: Elyra JupyterLab extension providing support for the Pipeline Editor. Learn more at https://elyra.readthedocs.io/en/stable/user_guide/pipelines.html
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - akchinSTC
    - lresende
