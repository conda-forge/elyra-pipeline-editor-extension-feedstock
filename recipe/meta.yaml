{% set name = "elyra-pipeline-editor-extension" %}
{% set version = "4.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 78e1404500769cab0e31fe40f42dd0d4245a4d0d361fb3c930e34c756872aa26

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - jupyter-packaging
    - pip
    - python {{ python_min }}
  run:
    - elyra-server =={{ version }}
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  commands:
    - exit 0

about:
  home: https://github.com/elyra-ai/elyra
  summary: Elyra JupyterLab extension providing support for the Pipeline Editor. Learn more at https://elyra.readthedocs.io/en/stable/user_guide/pipelines.html
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - akchinSTC
    - lresende
